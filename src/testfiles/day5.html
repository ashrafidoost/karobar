<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test File for Day 5</title>

    <style>
      .taskItem {
        text-decoration: wavy;
        color: blue;
        padding: 5px;
      }
      .completed {
        text-decoration: line-through;
        color: rgb(105, 105, 105);
        padding: 5px;
      }
      .delBtn {
        margin-top: 10px;
        padding: 5px 10px;
        font-size: 9px;
        margin-left: 10px;
        background-color: rgb(255, 0, 0);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
      .addBtn {
        margin-top: 10px;
        padding: 5px 10px;
        background-color: rgb(0, 162, 255);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
      .generalBtn {
        margin: 10px;
        padding: 5px 10px;
        font-size: 12px;
        background-color: rgb(1, 123, 171);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
    </style>

    <script lang="javascript">
      console.log("This is a test script for Day 5.");

      let tasks = []; // { id: Date.now(), text: "Learn JS", completed: false }

      function addTask() {
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");

        if (taskInput.value.trim() !== "") {
          const newTask = document.createElement("li");
          newTask.textContent = taskInput.value;
          newTask.className = "taskItem";
          newTask.addEventListener("click", () => {
            newTask.className =
              newTask.className === "taskItem" ? "completed" : "taskItem";
          });

          const deleteButton = document.createElement("button");
          deleteButton.textContent = "Del";
          deleteButton.className = "delBtn";
          deleteButton.addEventListener("click", () => {
            taskList.removeChild(newTask);
          });

          tasks.push({
            id: Date.now(),
            text: taskInput.value,
            completed: false,
          });

          //newTask.appendChild(deleteButton);
          //taskList.appendChild(newTask);

          renderTasks();
          taskInput.value = "";
        }
      }

      deleteTask = (index) => {
        tasks.splice(index, 1);
        renderTasks();
      };

      function renderTasks() {
        const currentTasks = [];

        tasks.forEach((element) => {
          currentTasks.push(element.text);
        });

        document.getElementById("taskList").innerHTML = currentTasks
          .map(
            (task) => `<li class="taskItem">${task} 
            <button class="delBtn" onclick="deleteTask(${tasks.indexOf(task)})">Del</button>
            </li>`,
          )
          .join("");
      }

      //   async function getUser() {

      //         "https://jsonplaceholder.typicode.com/users/1",
      //       );
      //       const user = await response.json();
      //       console.log(
      //         "User data: ",
      //         "User Name: " + user.name + ", User Email: " + user.email,
      //       );
      //     } catch (error) {
      //       console.error("Coul not fetch user - Error:", error);
      //     }
      //   }
    </script>
  </head>
  <body>
    <h1>Welcome to Day 5 Test File</h1>

    <div>
      <h2>Final Vanilla JS Challenge: The "Smart Task Manager"</h2>

      <input type="text" id="taskInput" placeholder="Enter a new task" />
      <button id="addTaskButton" onclick="addTask()" class="generalBtn">
        Add Task
      </button>

      <ul id="taskList"></ul>
    </div>
  </body>
